<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div id="hero">
        <div class="form-box">
            <div class="button-box">
                <button type="button" class="toggle-btn" th:onclick="'location.href=\'' + @{/login} + '\''">Log In</button>
                <button type="button" id="btn-signup" class="toggle-btn" th:onclick="'location.href=\'' + @{/signup} + '\''">Sign Up</button>
            </div>
            <div class="social-icons">
                <i class="bx bxl-facebook-circle"></i>
                <i class="bx bxl-instagram"></i>
                <i class="bx bxl-twitter"></i>
            </div>

            

            <form id="signup" class="input-group" th:action="@{/signup}" method="post" th:object="${user}">
                
                <!-- Display global error message if any -->
                <div th:if="${error}" class="error-message" th:text="${error}"></div>
                <div th:if="${message}" class="success-message" th:text="${message}"></div>

                <!-- Username -->
                <input type="text" id="username" class="input-field" placeholder="Username" th:field="*{username}">
                <div th:if="${#fields.hasErrors('username')}" class="error-message" th:errors="*{username}"></div>
            
                <!-- Full Name -->
                <input type="text" id="fullName" class="input-field" placeholder="Full Name" th:field="*{fullName}">
                <div th:if="${#fields.hasErrors('fullName')}" class="error-message" th:errors="*{fullName}"></div>
            
                <!-- Email -->
                <input type="text" id="email" class="input-field" placeholder="Email" th:field="*{email}">
                <div th:if="${#fields.hasErrors('email')}" class="error-message" th:errors="*{email}"></div>
            
                <!-- Password -->
                <input type="password" id="password" class="input-field" placeholder="Password" th:field="*{password}">
                <div th:if="${#fields.hasErrors('password')}" class="error-message" th:errors="*{password}"></div>
            
                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Register</button>
            </form>
            
        </div>
    </div>

</body>

</html>
